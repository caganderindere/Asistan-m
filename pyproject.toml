[project]
name = "claude-ses"
version = "0.1.0"
description = "Claude Code üzerinde kurulu, Türkçe sesli kişisel asistan"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    # uvicorn answers WebSocket upgrades with 404 unless a WebSocket library is installed.
    "websockets",
    "faster-whisper",
    # faster-whisper passes metadata_errors to av.open(), which PyAV 19 removed.
    "av<19",
    "edge-tts",
    # Cuba talks to Gemini over its REST API.
    "httpx",
    # The embedded terminal: a Windows pseudo-console.
    "pywinpty",
    "soundfile",
    "numpy",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "playwright"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = '-m "not network and not gpu and not e2e"'
markers = [
    "network: uses the Edge TTS service",
    "gpu: loads the real Whisper model",
    "e2e: drives the real app in a browser",
]
